<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>RADAR PRO</title>
<style>body{font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#0f172a;color:#e2e8f0}
.box{text-align:center} .spin{width:28px;height:28px;border:3px solid #334155;border-top-color:#14b8a6;border-radius:50%;animation:s 0.8s linear infinite;margin:0 auto 12px}
@keyframes s{to{transform:rotate(360deg)}}</style></head>
<body><div class="box"><div class="spin"></div><div>RADAR PRO yükleniyor…</div></div>
<script>
(async function(){
  var n = 14;
  var bases = [
    "https://cdn.jsdelivr.net/gh/samsunsarraf55-bit/radar-pro@main/chunks/",
    "https://raw.githubusercontent.com/samsunsarraf55-bit/radar-pro/main/chunks/"
  ];
  var parts = [];
  for (var i = 0; i < n; i++) {
    var ok = false;
    for (var bi = 0; bi < bases.length; bi++) {
      try {
        var r = await fetch(bases[bi] + "p" + i + ".txt?t=" + Date.now());
        if (r.ok) { parts.push(await r.text()); ok = true; break; }
      } catch (e) {}
    }
    if (!ok) {
      document.body.innerHTML = "<p>Parça yüklenemedi: " + i + ". chunks/p" + i + ".txt GitHub'a yüklenmeli.</p>";
      return;
    }
  }
  var html = parts.join("");
  document.open();
  document.write(html);
  document.close();
})();
</script></body></html>
