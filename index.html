<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RADAR PRO</title>
</head>
<body style="font-family:system-ui;padding:40px;background:#0f172a;color:#e2e8f0">RADAR PRO yükleniyor…</body>
<script>
(async function(){
  try { localStorage.removeItem("radar_proxy_base"); } catch(e){}
  try {
    const nSeg = 6, nPiece = 3;
    let b64 = "";
    for (let i = 0; i < nSeg; i++) {
      for (let j = 0; j < nPiece; j++) {
        const r = await fetch("chunks/seg" + i + "_" + j + ".b64?t=" + Date.now());
        if (!r.ok) throw new Error("seg"+i+"_"+j+" "+r.status);
        b64 += (await r.text()).trim();
      }
    }
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const ds = new DecompressionStream("gzip");
    let html = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
    html = html.replace(/var DEFAULT_PUBLIC_PROXY\s*=\s*"[^"]*"/, 'var DEFAULT_PUBLIC_PROXY = ""');
    document.open(); document.write(html); document.close();
  } catch(e) {
    document.body.innerHTML = "<p>Yükleme hatası: "+e+"</p>";
  }
})();
</script>
</html>
