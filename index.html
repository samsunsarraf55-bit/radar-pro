<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RADAR PRO</title>
</head>
<body style="font-family:system-ui;padding:40px;background:#0f172a;color:#e2e8f0">RADAR PRO yükleniyor…</body>
<script>
(async function(){
  try { localStorage.removeItem("radar_proxy_base"); } catch(e){}
  const n = 2;
  let b64 = "";
  for (let i = 0; i < n; i++) {
    const r = await fetch("chunks/app.p" + i + ".b64");
    if (!r.ok) throw new Error("chunk " + i);
    b64 += await r.text();
  }
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const ds = new DecompressionStream("gzip");
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  let html = await new Response(stream).text();
  html = html.replace(/var DEFAULT_PUBLIC_PROXY\s*=\s*"[^"]*"/, 'var DEFAULT_PUBLIC_PROXY = ""');
  document.open(); document.write(html); document.close();
})().catch(function(e){
  document.body.innerHTML = "<p>Yükleme hatası: "+e+"</p><p><a href=\"radar-pro-latest.html\">Doğrudan aç</a></p>";
});
</script>
</html>
