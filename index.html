<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RADAR PRO</title>
</head>
<body style="font-family:system-ui;padding:40px;background:#0f172a;color:#e2e8f0">RADAR PRO yükleniyor…</body>
<script>
(async function(){
  try { localStorage.removeItem("radar_proxy_base"); } catch(e){}
  try {
    const r = await fetch("radar-pro-latest.html?t=" + Date.now());
    if (!r.ok) throw new Error("HTTP " + r.status);
    let html = await r.text();
    html = html.replace(/var DEFAULT_PUBLIC_PROXY\s*=\s*"[^"]*"/, 'var DEFAULT_PUBLIC_PROXY = ""');
    document.open(); document.write(html); document.close();
  } catch(e) {
    document.body.innerHTML = "<p>Yükleme hatası: "+e+"</p><p><a href='radar-pro-latest.html' style='color:#38bdf8'>Doğrudan aç</a></p>";
  }
})();
</script>
</html>
