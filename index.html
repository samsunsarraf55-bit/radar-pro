<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RADAR PRO</title>
<script>
(function(){
  var candidates = [
    "radar-pro-latest (4).html",
    "radar-pro-latest.html"
  ];
  function tryNext(i){
    if(i >= candidates.length){
      document.body.innerHTML = "<p style=\"font-family:system-ui;padding:40px\">Uygulama HTML bulunamad\u0131.</p>";
      return;
    }
    fetch(encodeURI(candidates[i])).then(function(r){
      if(!r.ok) throw new Error("x");
      return r.text();
    }).then(function(t){
      if(t.indexOf("firmGrid")>=0 || t.indexOf("STANDARD_NAMES")>=0){
        document.open(); document.write(t); document.close();
      } else tryNext(i+1);
    }).catch(function(){ tryNext(i+1); });
  }
  tryNext(0);
})();
</script>
</head>
<body style="font-family:system-ui;padding:40px;background:#0f172a;color:#e2e8f0">RADAR PRO y\u00fckleniyor\u2026</body>
</html>
